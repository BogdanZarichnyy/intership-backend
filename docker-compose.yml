services:

  backend:
    build: .
    image: intership-backend
    container_name: backend
    restart: always
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    volumes:
      - .:/app
    command: ./start.sh

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
      timeout: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # postgres_for_tests:
  #   image: postgres:16
  #   container_name: test_postgres
  #   restart: always
  #   environment:
  #     POSTGRES_DB: internship_test_db
  #     POSTGRES_USER: test_user
  #     POSTGRES_PASSWORD: test_password
  #   ports:
  #     - "5433:5432"   # Тестова БД на окремому порту
  #   volumes:
  #     - postgres_for_tests_data:/var/lib/postgresql/data
  #     - ./docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U test_user -d internship_test_db"]
  #     interval: 5s
  #     retries: 5
  #     timeout: 5s

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"

volumes:
  postgres_data:
